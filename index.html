<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT Four</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif}
.header{background:#202123;padding:12px;text-align:center;font-weight:bold;font-size:18px;border-bottom:1px solid #333}
#chat{height:80vh;overflow:auto;padding:10px}
.msg{padding:8px 12px;margin:6px 0;border-radius:8px;max-width:90%}
.user{background:#343541;align-self:flex-end;margin-left:20px}
.bot{background:#444654}
.footer{display:flex;padding:8px;background:#202123;position:fixed;bottom:0;width:100%}
input{flex:1;padding:10px;border-radius:20px;border:none;outline:none}
button{margin-left:6px;padding:10px 14px;border-radius:20px;border:none;background:#10a37f;color:#fff;font-weight:bold}
</style>
</head>
<body>
<div class="header">GPT Four - by Ziddi Malik</div>
<div id="chat"><div class="msg bot">As-salamu Alaikum lala! Main GPT Four hun. Puchho jo puchhna hai.</div></div>
<div class="footer"><input id="q" placeholder="Type a message..."><button onclick="send()">Send</button></div>
<script>
let c=document.getElementById('chat');
function send(){
let i=document.getElementById('q');let t=i.value;if(!t)return;
c.innerHTML+=`<div class="msg user">${t}</div>`;
i.value='';c.scrollTop=c.scrollHeight;
setTimeout(()=>{
c.innerHTML+=`<div class="msg bot">Ziddi Malik bhai, aapne pucha: "${t}". Ye GPT Four ka jawab hai. Aap isko mazeed advance API se connect kar sakte hain.</div>`;
c.scrollTop=c.scrollHeight;
},600);
}
</script>
</body>
</html>
