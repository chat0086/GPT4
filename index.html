<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPT4 - AI Chat</title>
<script src="https://static.kaiads.com/ads-sdk/ads-sdk.v5.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#212121;color:#fff;font-family:system-ui,Arial,sans-serif;display:flex;flex-direction:column;height:100vh}
#header{background:#171717;padding:16px;text-align:center;font-size:18px;font-weight:600;border-bottom:1px solid #2f2f2f;letter-spacing:0.5px}
#header span{color:#a855f7}
#adContainer{width:100%;height:60px;background:#171717;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #2f2f2f}
#chat{flex:1;overflow-y:auto;padding:16px}
.message{display:flex;gap:12px;margin-bottom:20px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;flex-shrink:0}
.user .avatar{background:#a855f7;color:#fff}
.assistant .avatar{background:#10a37f;color:#fff}
.content{flex:1;padding-top:4px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.user .content{color:#ececec}
.assistant .content{color:#d1d5db}
#status{padding:0 16px 8px 60px;color:#8e8e8e;font-size:13px;display:none}
#inputWrapper{background:#212121;padding:12px 12px 16px 12px;border-top:1px solid #2f2f2f;display:flex;gap:10px;align-items:center}
#messageInput{flex:1;background:#2f2f2f;border:1px solid #3f3f3f;border-radius:24px;padding:14px 18px;color:#fff;outline:none;font-size:15px}
#messageInput:focus{border-color:#555}
#sendButton{background:#ffffff;color:#000;border:none;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#sendButton:disabled{opacity:0.5}
</style>
</head>
<body>

<div id="header"><span>GPT-4</span> Chat</div>
<div id="adContainer">Advertisement</div>
<div id="chat">
  <div class="message assistant">
    <div class="avatar">AI</div>
    <div class="content">Hello! I am GPT-4. How can I help you today?</div>
  </div>
</div>
<div id="status">GPT-4 is typing...</div>

<div id="inputWrapper">
  <input type="text" id="messageInput" placeholder="Message GPT-4..." autocomplete="off">
  <button id="sendButton" onclick="sendMessage()">↑</button>
</div>

<script>
// KaiAds Integration
let messageCounter = 0;
function showAd(){
  try{
    kaiads.getAd({
      publisher: '10afe1b6-d36e-4133-b44c-7d87f5139a62',
      app: 'GPT4',
      slot: 'GPT4-Main',
      h: 50,
      w: 320,
      onAdLoaded: function(ad){
        const container = document.getElementById('adContainer');
        container.innerHTML = '';
        ad.onDisplay();
        ad.print();
      },
      onAdError: function(){
        document.getElementById('adContainer').innerHTML = 'Sponsored';
      }
    });
  }catch(e){
    console.log('Ad error', e);
  }
}
showAd();

// Chat Function
async function sendMessage(){
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if(!text) return;

  addMessage(text, 'user');
  input.value = '';
  document.getElementById('status').style.display = 'block';
  document.getElementById('sendButton').disabled = true;

  try{
    const response = await fetch('https://text.pollinations.ai/' + encodeURIComponent(text) + '?model=openai&system=You are GPT-4, a helpful AI assistant.');
    const reply = await response.text();
    
    document.getElementById('status').style.display = 'none';
    addMessage(reply, 'assistant');
    
    // Show new ad every 3 messages for better revenue
    messageCounter++;
    if(messageCounter % 3 === 0){
      showAd();
    }
  }catch(error){
    document.getElementById('status').style.display = 'none';
    addMessage('Sorry, there was an error. Please try again.', 'assistant');
  }finally{
    document.getElementById('sendButton').disabled = false;
  }
}

function addMessage(text, role){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  const avatarText = role === 'user' ? 'U' : 'AI';
  div.innerHTML = `<div class="avatar">${avatarText}</div><div class="content"></div>`;
  div.querySelector('.content').innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById('messageInput').addEventListener('keypress', function(e){
  if(e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
