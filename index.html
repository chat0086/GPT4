<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPT4</title>
<script src="https://static.kaiads.com/ads-sdk/ads-sdk.v5.min.js"></script>
<style>
  body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif;width:240px;height:320px}
  #header{background:#6a1b9a;padding:8px;text-align:center;font-weight:bold}
  #ad-container{width:240px;height:40px;background:#222;text-align:center;line-height:40px;font-size:10px}
  #chat{height:180px;overflow-y:auto;padding:5px;font-size:13px}
  .msg{margin:4px 0;padding:5px;border-radius:4px}
  .user{background:#6a1b9a;text-align:right}
  .ai{background:#333}
  #inputBar{position:fixed;bottom:32px;width:240px;background:#222;display:flex}
  #inputBar input{flex:1;padding:8px;border:none;background:#111;color:#fff}
  #inputBar button{background:#6a1b9a;color:#fff;border:none;padding:8px}
</style>
</head>
<body>
<div id="header">GPT4</div>
<div id="ad-container">Loading Ad...</div>
<div id="chat"><div class="msg ai">Hello! GPT4 is ready. Ask anything?</div></div>
<div id="inputBar"><input id="q" type="text" placeholder="Type here..."/><button id="sendBtn">Send</button></div>
<script>
var publisherId='10afe1b6-d36e-4133-b44c-7d87f5139a62';
function showAd(){
  getKaiAd({
    publisher:publisherId,
    app:'GPT4',
    slot:'chat_slot',
    container:document.getElementById('ad-container'),
    onerror:err=>console.log(err),
    onready:ad=>{ad.call('display')}
  });
}
setTimeout(showAd,1000);
var chat=document.getElementById('chat'),input=document.getElementById('q'),count=0;
function sendMsg(){
  var text=input.value.trim();if(!text)return;
  var d=document.createElement('div');d.className='msg user';d.textContent=text;chat.appendChild(d);
  input.value='';chat.scrollTop=chat.scrollHeight;count++;
  if(count%2==0)showAd();
  setTimeout(()=>{
    var a=document.createElement('div');a.className='msg ai';a.textContent='GPT4 Answer for: '+text;
    chat.appendChild(a);chat.scrollTop=chat.scrollHeight;
  },600);
}
document.getElementById('sendBtn').addEventListener('click',sendMsg);
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
</script>
</body>
</html>
